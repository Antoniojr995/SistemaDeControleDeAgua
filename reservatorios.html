<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Reservatórios - ControlÁgua</title>
  <link rel="stylesheet" href="reservatorios.css">
  <link rel="stylesheet" href="global.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">
        <h2>💧 ControlÁgua</h2>
      </div>
      <nav class="nav-menu">
        <a href="painel.html" class="nav-item"><span>🏠</span> Início</a>
        <a href="reservatorios.html" class="nav-item active"><span>🛢️</span> Reservatórios</a>
        <a href="historico.html" class="nav-item active"><span>📊</span> Histórico</a>
        <a href="configuracoes.html" class="nav-item"><span>⚙️</span> Configurações</a>
        <a href="ajuda.html" class="nav-item"><span>❓</span> Ajuda</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div>
          <h1>Meus Reservatórios</h1>
          <p style="color: #64748b; font-size: 0.9rem; margin-top: 4px;">Selecione uma caixa d'água para abrir o painel detalhado</p>
        </div>
        <button id="btnLogout" class="btn-sair">🚪 Sair</button>
      </header>

      <section id="containerReservatorios" class="grid-reservatorios">
        <p class="msg-feedback">⏳ Carregando reservatórios...</p>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = window.location.origin;
  
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Valida se a sessão do usuário está ativa no servidor
      try {
        const res = await fetch(API_BASE + "/api/usuario-atual", { credentials: "same-origin" });
        const user = await res.json();
  
        if (!user.logado) {
          window.location.href = "index.html";
          return;
        }
      } catch (err) {
        window.location.href = "index.html";
        return;
      }
  
      // 2. Configura o botão de Sair (Logout)
      document.getElementById("btnLogout")?.addEventListener("click", async () => {
        await fetch(API_BASE + "/api/logout", { method: "POST", credentials: "same-origin" });
        sessionStorage.clear();
        window.location.href = "index.html";
      });
  
      // 3. Se estiver tudo OK, carrega os reservatórios
      carregarTodosReservatorios();
    });
  
    async function carregarTodosReservatorios() {
      const container = document.getElementById("containerReservatorios");
      
      try {
        // Faz o fetch usando a sessão do servidor
        const res = await fetch(API_BASE + "/api/minhas-caixas", { credentials: "same-origin" });
  
        if (!res.ok) {
          throw new Error("Servidor retornou status " + res.status);
        }
  
        const caixas = await res.json();
  
        if (!Array.isArray(caixas) || caixas.length === 0) {
          if (container) {
            container.innerHTML = `<p class="msg-feedback">Nenhum reservatório cadastrado para esta conta.</p>`;
          }
          return;
        }
  
        if (container) container.innerHTML = "";
  
        caixas.forEach(caixa => {
          const nivelPercent = Number(caixa.nivel ?? caixa.porcentagem ?? 0);
          const capacidade = caixa.capacidade || 1000;
          const volumeAtual = Math.round((nivelPercent / 100) * capacidade);
  
          const yTop = 90 - ((90 - 30) * (nivelPercent / 100));
          const pathD = `M13,${yTop} Q50,${yTop + 12} 87,${yTop} L88,90 Q50,105 12,90 Z`;
  
          const card = document.createElement("div");
          card.className = "card-reservatorio";
          card.innerHTML = `
            <div>
              <div class="res-header">
                <span class="res-title">🛢️ ${caixa.nome || 'Reservatório ' + caixa.id}</span>
                <span class="badge-status">Online</span>
              </div>
  
              <div class="res-info-body">
                <div class="res-svg-box">
                  <svg viewBox="0 0 100 120" style="width: 100%; height: 100%;">
                    <ellipse cx="50" cy="20" rx="40" ry="12" fill="#0284c7" />
                    <path d="M10,20 L15,95 Q50,110 85,95 L90,20 Z" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
                    <path d="${pathD}" fill="#38bdf8" opacity="0.85" />
                    <ellipse cx="50" cy="20" rx="40" ry="12" fill="none" stroke="#38bdf8" stroke-width="2" />
                  </svg>
                </div>
                <div class="res-details">
                  <div>Nível Atual: <strong>${nivelPercent}%</strong></div>
                  <div>Volume: <strong>${volumeAtual} L</strong> / ${capacidade} L</div>
                </div>
              </div>
            </div>
  
            <button class="btn-acessar" onclick="verCaixaEspecfica('${caixa.id}')">
              🛢️ Ver Caixa
            </button>
          `;
  
          if (container) container.appendChild(card);
        });
  
      } catch (err) {
        console.error("Erro ao carregar reservatórios:", err);
        if (container) {
          container.innerHTML = `<p class="msg-feedback" style="color: #ef4444;">❌ Erro ao conectar com o servidor ou carregar lista de reservatórios.</p>`;
        }
      }
    }
  
    function verCaixaEspecfica(caixaId) {
      sessionStorage.setItem("caixaSelecionada", caixaId);
      window.location.href = `detalhes-caixa.html?id=${caixaId}`;
    }
  </script>
  <script src="script-reservatorios.js" defer></script>
</body>
</html>
