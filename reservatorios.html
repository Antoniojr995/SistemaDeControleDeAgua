<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Reservatórios - Monitoramento</title>
  <link rel="stylesheet" href="style.css"> <!-- Seu arquivo CSS atual -->
  <style>
    /* Estilos específicos para a grid de reservatórios */
    .grid-reservatorios {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card-reservatorio {
      background: #0b172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card-reservatorio:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .res-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .res-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .badge-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-online { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .badge-offline { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    .res-info-body {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .res-svg-box {
      width: 70px;
      height: 80px;
    }

    .res-details {
      flex: 1;
    }

    .res-details div {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .res-details strong {
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .btn-acessar {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-acessar:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar / Menu Lateral -->
    <aside class="sidebar">
      <div class="logo">
        <h2>🛢️ ControlÁgua</h2>
      </div>
      <nav class="nav-menu">
        <a href="painel.html"><span>🏠</span> Início</a>
        <a href="reservatorios.html" class="active"><span>🛢️</span> Reservatórios</a>
        <a href="#" id="btnAbrirChamado"><span>❓</span> Ajuda / Suporte</a>
      </nav>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <header class="top-header">
        <div>
          <h1>Meus Reservatórios</h1>
          <p style="color: #64748b; font-size: 0.9rem;">Selecione uma caixa d'água para abrir o painel em tempo real</p>
        </div>
        <button id="btnLogout" class="btn-sair">🚪 Sair</button>
      </header>

      <!-- Container da Lista de Cards -->
      <section id="containerReservatorios" class="grid-reservatorios">
        <p style="color: #94a3b8;">Carregando reservatórios...</p>
      </section>
    </main>
  </div>

  <script src="script-reservatorios.js"></script>
</body>
</html>
