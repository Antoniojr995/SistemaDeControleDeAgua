<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-painel-admin.css">
</head>
<body>
  <h2>🧰 Painel do Administrador</h2>
  <p>Bem-vindo, <span id="adminNome"></span>! <button id="btnLogout">🚪 Sair</button></p>

  <!-- 🗂️ Menu de Navegação por Abas -->
  <div class="menu-abas">
    <button onclick="mudarAba('abaCaixas')">📦 Caixas d'Água</button>
    <button onclick="mudarAba('abaClientes')">👥 Clientes</button>
    <button onclick="mudarAba('abaRegistros')">📝 Cadastros</button>
    <button onclick="mudarAba('abaChamados')">🔔 Chamados</button>
  </div>

  <hr>

  <!-- 📦 CAMADA 1: Caixas d'Água -->
  <div id="abaCaixas" class="camada-conteudo">
    <h3>📦 Caixas d'Água Cadastradas</h3>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px;">
      <select id="listaCaixas" style="padding: 8px; min-width: 250px;"></select>
      <button id="btnVer">👁️ Ver Caixa Selecionada</button>
      <button onclick="renomearCaixaSelecionada()" style="background-color: #f0ad4e; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">✏️ Renomear Caixa</button>
      <button onclick="deletarCaixaSelecionada()" style="background-color: #d9534f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">🗑️ Apagar Caixa</button>
    </div>
    <div id="dadosCaixaSelecionada" style="margin-top: 15px;"></div>
  </div>

  <!-- 👥 CAMADA 2: Clientes -->
  <div id="abaClientes" class="camada-conteudo" style="display:none;">
    <h3>👥 Gerenciamento de Clientes</h3>
    <div id="listaClientes" style="margin-top: 15px;">
      <p>Carregando clientes...</p>
    </div>
  </div>

  <!-- 📝 CAMADA 3: Registros divididos em 3 colunas -->
  <div id="abaRegistros" class="camada-conteudo" style="display:none;">
    <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px;">
      
      <!-- COLUNA 1: CLIENTES -->
      <div style="flex: 1; min-width: 260px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3>👤 Cadastrar Cliente</h3>
        <form id="formNovoCliente" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
          <input type="text" id="novoClienteNome" placeholder="Nome do Cliente">
          <input type="email" id="novoClienteEmail" placeholder="E-mail" required>
          <input type="password" id="novoClienteSenha" placeholder="Senha" required>
          <button type="button" id="btnCadastrarCliente">Cadastrar Cliente</button>
        </form>
      </div>

      <!-- COLUNA 2: CAIXAS -->
      <div style="flex: 1; min-width: 260px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3>📦 Criar Nova Caixa</h3>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
          <input id="nomeCaixa" placeholder="Ex: Caixa Bloco A">
          <select id="selectClienteCriar">
            <option value="">Vincular a um cliente (Opcional)...</option>
          </select>
          <button id="btnAdicionar">Adicionar Caixa</button>
        </div>
      </div>

      <!-- COLUNA 3: ASSOCIAÇÃO -->
      <div style="flex: 1; min-width: 260px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3>🔗 Associar Caixa Existente</h3>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
          <select id="selectCaixaAssociar">
            <option value="">Selecione a Caixa...</option>
          </select>
          <select id="selectClienteAssociar">
            <option value="">Selecione o Cliente...</option>
          </select>
          <button id="btnAssociar">Associar Caixa</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 🔔 CAMADA 4: Chamados -->
  <div id="abaChamados" class="camada-conteudo" style="display:none;">
    <h3>🔔 Chamados Abertos por Clientes</h3>
    <div id="listaChamados">
      <p>Nenhum chamado pendente.</p>
    </div>
  </div>

  <p id="msg" style="margin-top: 15px; font-weight: bold;"></p>

  <!-- 🪟 MODAL: Ficha do Cliente -->
  <div id="modalFichaCliente" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:#fff; padding:25px; border-radius:10px; width:90%; max-width:550px; box-shadow:0 4px 15px rgba(0,0,0,0.3); position:relative;">
      <button onclick="fecharFichaCliente()" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:20px; cursor:pointer;">❌</button>
      
      <h2 style="margin-top:0;">📄 Ficha do Cliente #<span id="fichaId"></span></h2>
      <hr style="margin-bottom:15px; opacity:0.3;">

      <!-- Dados Cadastrais -->
      <div style="margin-bottom:15px;">
        <label><b>E-mail / Usuário:</b></label>
        <input type="text" id="fichaUsuario" style="width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <div style="margin-bottom:15px;">
        <label><b>Nova Senha:</b> <small style="color:#666;">(deixe em branco se não quiser alterar)</small></label>
        <input type="password" id="fichaSenha" placeholder="••••••••" style="width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
      </div>

      <!-- Caixas d'Água do Cliente -->
      <div style="margin-bottom:15px;">
        <label><b>Caixas d'Água Vinculadas:</b></label>
        <div id="fichaListaCaixas" style="margin-top:8px; background:#f8f9fa; padding:10px; border-radius:5px; max-height:130px; overflow-y:auto; border:1px solid #eee;">
          <!-- Carregado via JS -->
        </div>
      </div>

      <!-- Vincular Caixa Livre -->
      <div style="margin-bottom:20px;">
        <label><b>Vincular Nova Caixa (sem dono):</b></label>
        <select id="fichaSelectCaixasLivre" style="width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
          <option value="">Selecione para vincular...</option>
        </select>
      </div>

      <!-- Ações da Ficha -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
        <button onclick="excluirClienteFicha()" style="background:#d9534f; color:#fff; border:none; padding:10px 15px; border-radius:5px; cursor:pointer;">🗑️ Excluir Cliente</button>
        <div>
          <button onclick="fecharFichaCliente()" style="background:#6c757d; color:#fff; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; margin-right:5px;">Cancelar</button>
          <button onclick="salvarFichaCliente()" style="background:#28a745; color:#fff; border:none; padding:10px 15px; border-radius:5px; cursor:pointer;">💾 Salvar Alterações</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script-admin.js"></script>
</body>
</html>
